name: Update rankings

on:
  schedule:
    - cron: "47 3,9,15,21 * * *"
  workflow_dispatch:
    inputs:
      use_mock:
        description: "Generate rankings from mock data instead of YouTube Data API"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: update-rankings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    if: github.event_name != 'push'
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew

      - name: Validate YouTube API secret
        if: github.event_name != 'workflow_dispatch' || inputs.use_mock != 'true'
        shell: bash
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "YOUTUBE_API_KEY repository secret is not set."
            exit 1
          fi

      - name: Generate rankings from YouTube
        if: github.event_name != 'workflow_dispatch' || inputs.use_mock != 'true'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: ./gradlew run --args="generate"

      - name: Generate rankings from mock data
        if: github.event_name == 'workflow_dispatch' && inputs.use_mock == 'true'
        run: ./gradlew run --args="generate --mock"

      - name: Validate generated JSON
        run: ./gradlew run --args="validate"

      - name: Write validation summary
        if: always()
        run: node tools/actions/write-validation-action-summary.js

      - name: Detect changes
        id: diff
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- docs/data)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Show update summary
        shell: bash
        run: |
          if [ "${{ steps.diff.outputs.changed }}" = "true" ]; then
            echo "Ranking JSON changed and will be committed."
          else
            echo "Ranking JSON did not change. Nothing to commit."
          fi

      - name: Commit ranking data
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git commit -m "chore: ランキングデータを更新"
          git push

      - name: Notify failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/actions/notify-action-failure-issue.js
