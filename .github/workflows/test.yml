name: Test

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew

      - name: Test and build
        run: ./gradlew test build

      - name: Verify mock generation
        run: ./gradlew run --args="generate --mock"

      - name: Validate generated JSON
        run: ./gradlew run --args="validate"

      - name: Write validation summary
        if: always()
        run: node tools/actions/write-validation-action-summary.js

      - name: Notify failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/actions/notify-action-failure-issue.js
