<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>総合ランキング - YT Rank Lab</title>
    <meta name="description" content="独自スコアによるYouTube総合ランキング">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/pages/rankings.css">
  </head>
  <body data-page="overall">
    <a class="skip-link" href="#main">本文へ移動</a>
    <header class="site-header">
      <nav class="nav" aria-label="主要ナビゲーション">
        <a class="brand" href="../home.html">
          <span class="brand-mark">Y</span>
          <span>YT Rank Lab</span>
        </a>
        <div class="nav-links">
          <a aria-current="page" href="overall-ranking.html">総合</a>
          <a href="genre-ranking.html">ジャンル</a>
          <a href="history-ranking.html">過去日</a>
          <a href="../operations/generation-log.html">運用</a>
        </div>
        <button class="icon-button" type="button" data-theme-toggle aria-label="テーマを切り替え" title="テーマ">
          <span aria-hidden="true">◐</span>
        </button>
      </nav>
    </header>

    <main id="main">
      <section class="page-title">
        <p class="eyebrow" data-ranking-eyebrow>Overall ranking</p>
        <h1 data-ranking-title>総合ランキング</h1>
        <p data-updated-at>読み込み中</p>
      </section>

      <section class="toolbar" aria-label="ランキング操作">
        <div class="segmented" aria-label="期間">
          <button type="button" class="active" data-period-button="latest/overall.json" data-ranking-view="overall">24時間</button>
          <button type="button" data-period-button="latest/today.json" data-ranking-view="today">本日</button>
          <button type="button" data-period-button="latest/seven-days.json" data-ranking-view="seven-days">7日間</button>
          <button type="button" data-period-button="latest/shorts.json" data-ranking-view="shorts">Shorts</button>
          <button type="button" data-period-button="latest/long-form.json" data-ranking-view="long-form">通常動画</button>
          <button type="button" data-period-button="latest/trending.json" data-ranking-view="trending">急上昇</button>
          <button type="button" data-period-button="latest/discovery.json" data-ranking-view="discovery">発掘</button>
          <button type="button" data-ranking-view="history" data-history-button>過去日</button>
        </div>
        <label class="select-box history-picker" data-history-picker hidden>
          <span>過去日</span>
          <select data-overall-history-select></select>
        </label>
        <label class="search-box">
          <span>検索</span>
          <input type="search" data-ranking-search placeholder="タイトル・チャンネル・ジャンル">
        </label>
      </section>

      <section class="section-block">
        <div data-state="overall"></div>
        <div class="ranking-list" data-overall-ranking></div>
      </section>
    </main>

    <footer class="site-footer">
      <span>YT Rank Lab</span>
      <span>Generated JSON only</span>
    </footer>

    <script src="../assets/js/core/domain/genre-catalog.js"></script>
    <script src="../assets/js/core/platform/url-service.js"></script>
    <script src="../assets/js/core/platform/dom-service.js"></script>
    <script src="../assets/js/core/presentation/formatter.js"></script>
    <script src="../assets/js/core/data/json-repository.js"></script>
    <script src="../assets/js/core/services/generation-health-service.js"></script>
    <script src="../assets/js/core/services/youtube-url-service.js"></script>
    <script src="../assets/js/core/presentation/rank-change-presenter.js"></script>
    <script src="../assets/js/core/presentation/genre-link-renderer.js"></script>
    <script src="../assets/js/core/presentation/ranking-card-renderer.js"></script>
    <script src="../assets/js/core/presentation/ranking-list-renderer.js"></script>
    <script src="../assets/js/core/presentation/health-check-renderer.js"></script>
    <script src="../assets/js/core/presentation/source-results-renderer.js"></script>
    <script src="../assets/js/core/platform/theme-controller.js"></script>
    <script src="../assets/js/core/application/yt-rank-application.js"></script>
    <script src="../assets/js/core/bootstrap/genre-definitions.js"></script>
    <script src="../assets/js/core/bootstrap/yt-rank-application-factory.js"></script>
    <script src="../assets/js/common.js"></script>
    <script src="../assets/js/pages/rankings/overall-ranking-view-labels.js"></script>
    <script src="../assets/js/pages/rankings/ranking-entry-filter.js"></script>
    <script src="../assets/js/pages/rankings/overall-ranking-url-state.js"></script>
    <script src="../assets/js/pages/rankings/overall-empty-state-renderer.js"></script>
    <script src="../assets/js/pages/rankings/overall-history-selector.js"></script>
    <script src="../assets/js/pages/rankings/overall-ranking-page.js"></script>
    <script src="../assets/js/ranking.js"></script>
  </body>
</html>
