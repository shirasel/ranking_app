<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>過去日ランキング - YT Rank Lab</title>
    <meta name="description" content="過去日に生成されたYouTubeランキング">
    <link rel="stylesheet" href="../assets/css/style.css">
  </head>
  <body data-page="history">
    <a class="skip-link" href="#main">本文へ移動</a>
    <header class="site-header">
      <nav class="nav" aria-label="主要ナビゲーション">
        <a class="brand" href="../home.html">
          <span class="brand-mark">Y</span>
          <span>YT Rank Lab</span>
        </a>
        <div class="nav-links">
          <a href="overall-ranking.html">総合</a>
          <a href="genre-ranking.html">ジャンル</a>
          <a aria-current="page" href="history-ranking.html">過去日</a>
          <a href="../operations/generation-log.html">運用</a>
        </div>
        <button class="icon-button" type="button" data-theme-toggle aria-label="テーマを切り替え" title="テーマ">
          <span aria-hidden="true">◐</span>
        </button>
      </nav>
    </header>

    <main id="main">
      <section class="page-title">
        <p class="eyebrow">History ranking</p>
        <h1 data-history-title>過去日ランキング</h1>
        <p data-updated-at>読み込み中</p>
        <div class="page-actions">
          <a class="button primary" href="overall-ranking.html">最新ランキングへ</a>
          <a class="button secondary" href="genre-ranking.html">ジャンルで探す</a>
        </div>
      </section>

      <section class="toolbar" aria-label="過去日操作">
        <label class="select-box">
          <span>日付</span>
          <select data-history-select></select>
        </label>
      </section>

      <section class="section-block">
        <div data-state="history"></div>
        <div class="ranking-list" data-history-ranking></div>
      </section>
    </main>

    <footer class="site-footer">
      <span>YT Rank Lab</span>
      <span>Generated JSON only</span>
    </footer>

    <script src="../assets/js/common.js"></script>
    <script src="../assets/js/ranking.js"></script>
  </body>
</html>
