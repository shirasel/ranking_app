# Production collection sources.
# Keep API keys out of this file. Add only public YouTube IDs and search terms.
#
# Channel IDs must start with UC... and can be added when you want stable
# coverage for specific official or creator channels.
channels: []

keywords:
  - term: Minecraft
    priority: 100
  - term: プログラミング
    priority: 110
  - term: VTuber
    priority: 120
  - term: ゲーム実況
    priority: 130
  - term: 作業用BGM
    priority: 180
  - term: 生成AI
    priority: 190

# Add specific video IDs only when you want to force-track known candidates.
videos: []

collection:
  maxVideos: 500
  maxSearchResultsPerKeyword: 12
  includePopularVideos: true
  maxPopularVideos: 50
  maxChannelVideos: 10
  maxEstimatedQuotaUnits: 800
  reservedDetailQuotaUnits: 20
  popularPriority: 900
  regionCode: JP
